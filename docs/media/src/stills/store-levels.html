<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="store.css" />
		<style>
			body {
				flex-direction: row;
				align-items: center;
				gap: 48px;
			}
			h1 {
				flex: 0 0 300px;
			}
			main {
				display: grid;
				grid-template-columns: 112px 1fr;
				gap: 14px 12px;
				align-items: start;
			}
			img {
				width: 680px;
			}
		</style>
	</head>
	<body>
		<h1>Four levels, and each paragraph keeps its own.</h1>
		<main>
			<div class="label">Full</div>
			<img src="../assets/stills/levels-en-0.png" alt="" />
			<div class="label">Brief</div>
			<img src="../assets/stills/levels-en-1.png" alt="" />
			<div class="label">Key</div>
			<img src="../assets/stills/levels-en-2.png" alt="" />
			<div class="label">Takeaway</div>
			<img src="../assets/stills/levels-en-3.png" alt="" />
		</main>
	</body>
</html>
