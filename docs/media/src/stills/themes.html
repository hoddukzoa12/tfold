<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				width: 860px;
				background: #2a2a2e;
			}
			main {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 16px;
				padding: 24px;
			}
			img {
				display: block;
				width: 100%;
				border-radius: 12px;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="../assets/stills/theme-light.png" alt="" />
			<img src="../assets/stills/theme-dark.png" alt="" />
		</main>
	</body>
</html>
