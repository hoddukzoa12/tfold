<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				width: 760px;
				background: #fff;
			}
			main {
				display: flex;
				justify-content: center;
				align-items: flex-start;
				gap: 28px;
				padding: 36px;
			}
			img {
				display: block;
				width: 320px;
			}
		</style>
	</head>
	<body>
		<main>
			<img data-still="popup-LANG-light.png" alt="" />
			<img data-still="popup-LANG-dark.png" alt="" />
		</main>
		<script>
			const lang = new URLSearchParams(location.search).get('lang') ?? 'en';
			for (const image of document.images) image.src = `../assets/stills/${image.dataset.still.replace('LANG', lang)}`;
		</script>
	</body>
</html>
