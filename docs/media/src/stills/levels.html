<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<style>
			@font-face {
				font-family: Pretendard;
				font-weight: 600;
				src: url('../assets/fonts/Pretendard-SemiBold.woff2') format('woff2');
			}
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				width: 900px;
				background: #2a2a2e;
				font-family: Pretendard, sans-serif;
			}
			main {
				display: grid;
				gap: 14px;
				padding: 24px;
			}
			.row {
				display: grid;
				grid-template-columns: 112px 728px;
				gap: 12px;
				align-items: start;
			}
			.label {
				justify-self: start;
				height: 34px;
				margin-top: 4px;
				padding: 0 12px;
				border-radius: 9px;
				background: #c9fb2c;
				color: #2a2a2e;
				font-size: 18px;
				font-weight: 600;
				line-height: 34px;
			}
			img {
				display: block;
				width: 728px;
				border-radius: 12px;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="row"><div class="label">Full</div><img data-still="levels-LANG-0.png" alt="" /></div>
			<div class="row"><div class="label">Brief</div><img data-still="levels-LANG-1.png" alt="" /></div>
			<div class="row"><div class="label">Key</div><img data-still="levels-LANG-2.png" alt="" /></div>
			<div class="row"><div class="label">Takeaway</div><img data-still="levels-LANG-3.png" alt="" /></div>
		</main>
		<script>
			const lang = new URLSearchParams(location.search).get('lang') ?? 'en';
			for (const image of document.images) image.src = `../assets/stills/${image.dataset.still.replace('LANG', lang)}`;
		</script>
	</body>
</html>
