<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>X-like fixture</title>
<style>
body { margin: 0; font: 15px/20px system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; color: #0f1419; background: #fff; }
a { color: #1d9bf0; text-decoration: none; }
button { font: inherit; }
.app { display: flex; justify-content: center; }
.left { width: 240px; position: sticky; top: 0; align-self: flex-start; padding: 12px; box-sizing: border-box; }
.left nav a { display: block; padding: 10px 12px; color: #0f1419; font-size: 19px; }
.nav-tip { padding: 10px 12px; color: #536471; font-size: 13px; }
.post-button { margin-top: 12px; width: 100%; padding: 12px; border: 0; border-radius: 24px; background: #0f1419; color: #fff; text-align: left; }
main { display: flex; }
.primary { width: 600px; border-left: 1px solid #eff3f4; border-right: 1px solid #eff3f4; }
.primary h2 { position: sticky; top: 0; z-index: 1; height: 53px; margin: 0; padding: 0 16px; box-sizing: border-box; font-size: 20px; line-height: 53px; background: rgba(255, 255, 255, 0.92); border-bottom: 1px solid #eff3f4; }
.cell { position: absolute; top: 0; left: 0; right: 0; overflow: hidden; border-bottom: 1px solid #eff3f4; }
article { padding: 12px 16px; cursor: pointer; }
article:hover { background: #f7f9f9; }
.user { margin-bottom: 4px; }
.name { font-weight: 700; margin-right: 4px; }
.handle { color: #536471; }
.tweet-text { white-space: pre-wrap; overflow-wrap: break-word; }
.mention { display: inline; }
.emoji { height: 1.2em; width: 1.2em; margin: 0 0.05em; vertical-align: -0.2em; }
.show-more { display: block; margin-top: 2px; padding: 0; border: 0; background: none; color: #1d9bf0; cursor: pointer; }
.actions { display: flex; gap: 48px; margin-top: 12px; }
.actions button { padding: 0; border: 0; background: none; color: #536471; cursor: pointer; }
.notice { color: #536471; padding: 8px 0; }
.sidebar { width: 350px; position: sticky; top: 0; align-self: flex-start; padding: 12px 24px; box-sizing: border-box; }
.sidebar > * { margin-bottom: 16px; }
.box { border: 1px solid #eff3f4; border-radius: 16px; padding: 12px 16px; }
.composer { min-height: 60px; }
.muted { color: #536471; font-size: 13px; }
.detail { padding: 16px; }
.detail .tweet-text { font-size: 17px; line-height: 24px; }
.box h3 { margin: 0 0 8px; font-size: 18px; }
[data-theme] body { background: #000; }
[data-theme] article:hover { background: #080808; }
[data-theme] .name, [data-theme] .box h3 { color: #e7e9ea; }
[data-theme="dark-spans"] .tweet-text .t { color: #e7e9ea; }
[data-theme="dark-block"] { color-scheme: dark; }
</style>
</head>
<body>
<div id="react-root"></div>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script src="/x-like/app.js"></script>
</body>
</html>
